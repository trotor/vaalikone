<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaalikone Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        header h1 { font-size: 20px; font-weight: 600; color: #f1f5f9; }
        header .stats { font-size: 13px; color: #94a3b8; margin-left: auto; }
        .filters {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 8px 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
        }
        .filters label { color: #94a3b8; }
        .filters select, .filters input[type="checkbox"] {
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 13px;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message.user {
            background: #1e40af;
            border-radius: 16px 16px 4px 16px;
            padding: 12px 16px;
            align-self: flex-end;
            margin-left: auto;
            max-width: 600px;
        }
        .message.assistant {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px 16px 16px 16px;
            padding: 16px 20px;
        }
        .message.assistant .answer {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
            font-size: 13px;
            color: #94a3b8;
        }
        .source-tag {
            display: inline-block;
            background: #334155;
            border-radius: 4px;
            padding: 2px 8px;
            margin: 2px 4px 2px 0;
            font-size: 12px;
        }
        .loading {
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 4px 0;
        }
        .loading-dots {
            display: flex;
            gap: 6px;
        }
        .loading-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3b82f6;
            animation: pulse 1.4s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { transform: scale(0.5); opacity: 0.2; background: #3b82f6; }
            50% { transform: scale(1.2); opacity: 1; background: #60a5fa; }
        }
        .loading-text {
            font-style: italic;
            animation: fadeInOut 2s ease-in-out infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .message.assistant.is-loading {
            border-color: #3b82f6;
            animation: shimmer 2s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { border-color: #334155; }
            50% { border-color: #3b82f6; }
        }
        .input-area {
            background: #1e293b;
            border-top: 1px solid #334155;
            padding: 16px 24px;
        }
        .input-row {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
        }
        .input-row input[type="text"] {
            flex: 1;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            outline: none;
        }
        .input-row input[type="text"]:focus { border-color: #3b82f6; }
        .input-row input[type="text"]::placeholder { color: #64748b; }
        .input-row button {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
        }
        .input-row button:hover { background: #2563eb; }
        .input-row button:disabled { background: #475569; cursor: not-allowed; }
        .welcome {
            max-width: 600px;
            margin: auto;
            text-align: center;
            color: #94a3b8;
        }
        .welcome h2 { color: #f1f5f9; margin-bottom: 12px; font-size: 24px; }
        .welcome p { margin-bottom: 16px; line-height: 1.5; }
        .welcome .examples { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .welcome .example {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            text-align: left;
            color: #cbd5e1;
            transition: border-color 0.2s;
        }
        .welcome .example:hover { border-color: #3b82f6; color: #f1f5f9; }
        .status-bar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 6px 24px;
            font-size: 12px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .status-dot.green { background: #22c55e; }
        .status-dot.red { background: #ef4444; }
        .status-dot.yellow { background: #eab308; }
        .status-item { color: #94a3b8; }
    </style>
</head>
<body>
    <header>
        <h1>Vaalikone Chat</h1>
        <div class="stats" id="stats"></div>
    </header>
    <div class="status-bar" id="statusBar">
        <span class="status-item" id="statusInternet"><span class="status-dot yellow"></span>Internet: tarkistetaan...</span>
        <span class="status-item" id="statusOpenai"><span class="status-dot yellow"></span>OpenAI: tarkistetaan...</span>
        <span class="status-item" id="statusOllama"><span class="status-dot yellow"></span>Ollama: tarkistetaan...</span>
    </div>
    <div class="filters">
        <label>Puolue:</label>
        <select id="partyFilter">
            <option value="">Kaikki puolueet</option>
        </select>
        <label><input type="checkbox" id="useSemantic" checked> Semanttinen haku</label>
        <label>Malli:</label>
        <select id="modelSelect"></select>
    </div>
    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
            <h2>Kysy suomalaisesta politiikasta</h2>
            <p>Tietokannassa on puolueohjelmia, varjobudjetteja ja kansanedustajien tietoja kaikilta 16 puolueelta.</p>
            <div class="examples" id="examples"></div>
        </div>
    </div>
    <div class="input-area">
        <div class="input-row">
            <input type="text" id="questionInput" placeholder="Kysy jotain suomalaisesta politiikasta..." autofocus>
            <button id="sendBtn">Kysy</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeEl = document.getElementById('welcome');
        const examplesEl = document.getElementById('examples');

        const EXAMPLES = [
            'Mita puolueet sanovat metsakeskuksesta?',
            'Vertaa puolueiden veropolitiikkaa',
            'Miten puolueet suhtautuvat maahanmuuttoon?',
            'Mita varjobudjeteissa sanotaan koulutuksesta?',
            'Mika on liberaalipuolueen kanta ydinvoimaan?',
        ];

        // Render examples safely
        EXAMPLES.forEach(q => {
            const div = document.createElement('div');
            div.className = 'example';
            div.textContent = q;
            div.addEventListener('click', () => { input.value = q; send(); });
            examplesEl.appendChild(div);
        });

        let connectivity = { openai: false, ollama: false, internet: false, ollama_models: [] };

        function setStatus(id, ok, label) {
            const el = document.getElementById(id);
            el.textContent = '';
            const dot = document.createElement('span');
            dot.className = 'status-dot ' + (ok ? 'green' : 'red');
            el.appendChild(dot);
            el.appendChild(document.createTextNode(label));
        }

        function populateModels() {
            const sel = document.getElementById('modelSelect');
            sel.textContent = '';

            if (connectivity.openai) {
                [
                    ['o4-mini', 'o4-mini (OpenAI, nopea)'],
                    ['gpt-4.1-mini', 'GPT-4.1 Mini (OpenAI)'],
                    ['gpt-4.1', 'GPT-4.1 (OpenAI)'],
                    ['o3-mini', 'o3-mini (OpenAI, reasoning)'],
                ].forEach(([val, label]) => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = label;
                    sel.appendChild(opt);
                });
            }

            if (connectivity.ollama && connectivity.ollama_models.length > 0) {
                connectivity.ollama_models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = 'ollama/' + m;
                    opt.textContent = m + ' (lokaali)';
                    sel.appendChild(opt);
                });
            }

            // If no models, add a text-only mode
            if (sel.options.length === 0) {
                const opt = document.createElement('option');
                opt.value = '__text_only__';
                opt.textContent = 'Vain tekstihaku (ei LLM:aa)';
                sel.appendChild(opt);
            }

            // Auto-disable semantic search if offline and no OpenAI
            if (!connectivity.openai) {
                document.getElementById('useSemantic').checked = false;
            }
        }

        // Check connectivity
        fetch('/api/v1/connectivity').then(r => r.json()).then(data => {
            connectivity = data;
            setStatus('statusInternet', data.internet, 'Internet: ' + (data.internet ? 'OK' : 'ei yhteytta'));
            setStatus('statusOpenai', data.openai, 'OpenAI: ' + (data.openai ? 'OK' : 'ei kaytettavissa'));
            setStatus('statusOllama', data.ollama, 'Ollama: ' + (data.ollama ? data.ollama_models.length + ' mallia' : 'ei kaytettavissa'));
            populateModels();
        }).catch(() => {
            setStatus('statusInternet', false, 'Internet: ei yhteytta');
            setStatus('statusOpenai', false, 'OpenAI: ei kaytettavissa');
            setStatus('statusOllama', false, 'Ollama: ei kaytettavissa');
            populateModels();
        });

        // Load stats
        fetch('/api/v1/stats').then(r => r.json()).then(data => {
            document.getElementById('stats').textContent =
                data.parties + ' puoluetta | ' + data.documents + ' dokumenttia | ' +
                data.embeddings + ' embeddings | ' + data.votes + ' aanestysta';
        });

        // Load parties
        fetch('/api/v1/parties').then(r => r.json()).then(parties => {
            const sel = document.getElementById('partyFilter');
            parties.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.abbreviation;
                opt.textContent = p.abbreviation + ' - ' + p.name;
                sel.appendChild(opt);
            });
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        sendBtn.addEventListener('click', send);

        function createUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'message user';
            div.textContent = text;
            return div;
        }

        function createLoadingMessage() {
            const div = document.createElement('div');
            div.className = 'message assistant is-loading';
            const loading = document.createElement('div');
            loading.className = 'loading';
            const dots = document.createElement('div');
            dots.className = 'loading-dots';
            for (let i = 0; i < 3; i++) {
                dots.appendChild(document.createElement('span'));
            }
            loading.appendChild(dots);
            const text = document.createElement('span');
            text.className = 'loading-text';
            text.textContent = 'Haetaan vastausta...';
            loading.appendChild(text);
            div.appendChild(loading);
            return div;
        }

        function populateAssistantMessage(container, data) {
            container.classList.remove('is-loading');
            container.textContent = '';

            const answer = document.createElement('div');
            answer.className = 'answer';
            answer.textContent = data.answer;
            container.appendChild(answer);

            if (data.sources && data.sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sourcesDiv.appendChild(document.createTextNode('Lahteet: '));
                data.sources.forEach(s => {
                    const tag = document.createElement('span');
                    tag.className = 'source-tag';
                    tag.textContent = '[' + (s.party || '?') + '] ' + (s.title || '');
                    sourcesDiv.appendChild(tag);
                });
                container.appendChild(sourcesDiv);
            }
        }

        function showError(container, message) {
            container.textContent = '';
            const err = document.createElement('div');
            err.className = 'answer';
            err.style.color = '#f87171';
            err.textContent = 'Virhe: ' + message;
            container.appendChild(err);
        }

        async function send() {
            const question = input.value.trim();
            if (!question) return;

            if (welcomeEl && welcomeEl.parentNode) {
                welcomeEl.parentNode.removeChild(welcomeEl);
            }

            chatArea.appendChild(createUserMessage(question));

            const loadingMsg = createLoadingMessage();
            chatArea.appendChild(loadingMsg);
            chatArea.scrollTop = chatArea.scrollHeight;

            input.value = '';
            sendBtn.disabled = true;

            try {
                const party = document.getElementById('partyFilter').value || null;
                const model = document.getElementById('modelSelect').value;
                const useSemantic = document.getElementById('useSemantic').checked;

                if (model === '__text_only__') {
                    // Text search only - no LLM
                    const resp = await fetch('/api/v1/search?q=' + encodeURIComponent(question) + (party ? '&party=' + party : '') + '&limit=5');
                    const data = await resp.json();
                    if (data.results && data.results.length > 0) {
                        const answer = data.results.map(r =>
                            '[' + (r.party || '?') + '] ' + (r.title || '') + '\n' +
                            (r.snippet || r.chunk_text || '').replace(/<\/?b>/g, '').substring(0, 300) + '...'
                        ).join('\n\n');
                        populateAssistantMessage(loadingMsg, {
                            answer: 'Hakutulokset (ilman AI-vastausta):\n\n' + answer,
                            sources: data.results.map(r => ({ party: r.party, title: r.title })),
                        });
                    } else {
                        populateAssistantMessage(loadingMsg, {
                            answer: 'Ei hakutuloksia.',
                            sources: [],
                        });
                    }
                } else {
                    const resp = await fetch('/api/v1/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: question, party: party, model: model, use_semantic: useSemantic }),
                    });
                    const data = await resp.json();
                    populateAssistantMessage(loadingMsg, data);
                }
            } catch (err) {
                showError(loadingMsg, err.message);
            }

            sendBtn.disabled = false;
            chatArea.scrollTop = chatArea.scrollHeight;
            input.focus();
        }
    </script>
</body>
</html>
