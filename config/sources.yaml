# Puolueiden viralliset dokumentit: vaaliohjelmat, puolueohjelmat ja varjobudjetit.
# Käytä: vaalikone ingest programs            (kaikki)
#       vaalikone ingest programs --party SDP  (vain yksi puolue)
#       vaalikone ingest programs --kind varjobudjetti
# type: pdf = lataa PDF, web = yksittäinen sivu, crawl = sivuston läpikäynti
# Valinnaiset: language (oletus fi), year, min_chars (oletus 2000; lyhyempi teksti = virhe,
# koska se on lähes aina laskeutumissivu), depth/max_pages (crawl).
# Täydentävät harvesterit: `ingest party-register` (puoluerekisteri.fi) ja `ingest pohtiva` (FSD).
