# Puolueet. Lähde: Oikeusministeriön puoluerekisteri (https://puoluerekisteri.fi).
#   registry_id  = puoluerekisterin id (publicapi/party/registered) — `vaalikone ingest party-register`
#   pohtiva      = FSD Pohtivan puoluekoodi jos eri kuin lyhenne; null = ei Pohtivassa
#   registered   = false jos puolue on poistettu rekisteristä (dokumentit säilytetään)
parties:
  # Eduskuntapuolueet
  - name: "Suomen Sosiaalidemokraattinen Puolue"
    abbreviation: "SDP"
    registry_id: 1
    website: "https://www.sdp.fi"
    ideology: "Sosialidemokratia"
    founded: 1899

  - name: "Kansallinen Kokoomus"
    abbreviation: "KOK"
    registry_id: 3
    website: "https://www.kokoomus.fi"
    ideology: "Konservatismi, liberalismi"
    founded: 1918

  - name: "Perussuomalaiset"
    abbreviation: "PS"
    registry_id: 8
    website: "https://www.perussuomalaiset.fi"
    ideology: "Kansalliskonservatismi, populismi"
    founded: 1995

  - name: "Suomen Keskusta"
    abbreviation: "KESK"
    registry_id: 2
    website: "https://www.keskusta.fi"
    ideology: "Keskustalaisuus, agraariliberalismi"
    founded: 1906

  - name: "Vihreä liitto"
    abbreviation: "VIHR"
    registry_id: 6
    website: "https://www.vihreat.fi"
    ideology: "Vihreä politiikka"
