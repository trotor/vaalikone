  - name: "Svenska folkpartiet i Finland"
    abbreviation: "RKP"
    registry_id: 4
    pohtiva: "SFP"
    website: "https://www.sfp.fi"
    ideology: "Liberalismi, kielivähemmistön oikeudet"
    founded: 1906

  - name: "Kristillisdemokraatit"
    abbreviation: "KD"
    registry_id: 5
    website: "https://www.kd.fi"
    ideology: "Kristillisdemokratia"
