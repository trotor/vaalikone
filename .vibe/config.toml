# Projektikohtainen MCP-konfiguraatio: vaalikone-palvelin käynnistyy stdio:llä
# projektin .venv:stä. Vaatii, että kansio on luotettu (vibe /trusted-folders).
# Käyttäjätason konfiguraatio (vibe mcp add vaalikone ...) riittää myös.
[[mcp_servers]]
name = "vaalikone"
transport = "stdio"
command = "/Users/teroronkko/code/vaalikone/.venv/bin/python"
args = ["-m", "vaalikone.mcp.server"]
startup_timeout_sec = 30.0
tool_timeout_sec = 180.0
