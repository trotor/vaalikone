services:
  # API konttina (valinnainen — voi ajaa myös suoraan: uvicorn vaalikone.api.app:app)
  api:
    profiles:
      - api
    build: .
    ports:
      - "127.0.0.1:8003:8003"
    env_file: .env
    volumes:
      - ./vaalikone.db:/app/vaalikone.db
      - ./config:/app/config:ro

  # Celery-worker taustatöihin (--queue), vaatii redisin
  worker:
    profiles:
      - queue
    build: .
    command: celery -A vaalikone.workers.tasks worker --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./vaalikone.db:/app/vaalikone.db
      - ./config:/app/config:ro

  # PostgreSQL on valinnainen: oletuksena data on paikallisessa SQLite-tiedostossa
  # (vaalikone.db). Käynnistä vain jos haluat pgvectorin: docker compose --profile pg up -d postgres
  postgres:
    profiles:
      - pg
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaalikone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaalikone}
      POSTGRES_DB: ${POSTGRES_DB:-vaalikone}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis vain Celery-taustatöihin (--queue): docker compose --profile queue up -d redis worker
  redis:
    profiles:
      - queue
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev
    profiles:
      - auth

volumes:
  pgdata:
